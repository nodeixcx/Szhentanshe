<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S侦探社｜论坛</title>
    <!-- ✅ 静态预加载 Supabase SDK，消除异步时序问题 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <style>
        :root {
            --bg-primary: #0b0c10;
            --text-main: #f2f3f7;
            --text-sub: #989ca8;
            --accent: #7398ff;
            --accent-fade: rgba(115, 152, 255, 0.12);
            --border-fade: rgba(255, 255, 255, 0.08);
            --transition: all 0.28s ease;
        }
        html.light {
            --bg-primary: #f7f8fc;
            --text-main: #11141c;
            --text-sub: #595d6b;
            --accent: #507ee8;
            --accent-fade: rgba(80, 126, 232, 0.12);
            --border-fade: rgba(0, 0, 0, 0.1);
        }
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, -apple-system, sans-serif}
        body{background:var(--bg-primary);color:var(--text-main);min-height:100vh;transition: var(--transition)}
        nav{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;padding:1.2rem 5%;border-bottom:1px solid var(--border-fade)}
        .brand{font-size:1.4rem;font-weight:bold}
        .nav-spacer{flex:1}
        nav button, nav a{
            background:transparent;
            color:var(--text-main);
            border:1px solid var(--border-fade);
            padding:0.5rem 1rem;
            border-radius:8px;
            text-decoration:none;
            cursor:pointer;
            transition:var(--transition);
        }
        nav button:hover, nav a:hover{
            border-color:var(--accent);
            background:var(--accent-fade);
        }
        main{max-width:1000px;margin:3rem auto;padding:0 5%}
        h2{margin-bottom:1.2rem}
        .card{
            border:1px solid var(--border-fade);
            border-radius:12px;
            padding:1.4rem;
            margin-bottom:1rem;
            transition:var(--transition);
        }
        .card:hover{border-color:var(--accent)}
        .post-title{font-size:1.15rem;font-weight:bold;margin-bottom:0.5rem}
        .post-meta{font-size:0.85rem;color:var(--text-sub);margin-bottom:0.7rem;display:flex;gap:0.8rem;align-items:center}
        .post-content{line-height:1.6;margin-bottom:1rem}
        .reply-btn{
            border:1px solid var(--border-fade);
            background:transparent;
            color:var(--text-main);
            padding:0.3rem 0.7rem;
            border-radius:6px;
            cursor:pointer;
        }
        .reply-box{margin:1rem 0;padding:1rem;border:1px dashed var(--border-fade);border-radius:8px;display:none}
        .reply-box.show{display:block}
        .comment-item{
            margin:0.8rem 0 0 1.2rem;
            padding:0.8rem;
            border-left:2px solid var(--accent-fade);
        }
        .comment-meta{font-size:0.8rem;color:var(--text-sub);margin-bottom:0.4rem}
        .del-small{
            color:#f87171;
            background:transparent;
            border:none;
            cursor:pointer;
            font-size:0.8rem;
            margin-left:0.6rem;
        }
        .del-post-btn{
            color:#f87171;
            border:1px solid #f8717160;
            background:transparent;
            padding:0.3rem 0.7rem;
            border-radius:6px;
            cursor:pointer;
            font-size:0.85rem;
        }
        .form-box{
            border:1px solid var(--border-fade);
            border-radius:12px;
            padding:1.4rem;
            margin-bottom:2rem;
        }
        input,textarea{
            width:100%;
            background:transparent;
            color:var(--text-main);
            border:1px solid var(--border-fade);
            border-radius:8px;
            padding:0.8rem;
            margin-bottom:0.8rem;
            font-size:1rem;
        }
        textarea{min-height:120px;resize:vertical}
        .submit{
            background:var(--accent);
            color:white;
            border:none;
            padding:0.7rem 1.4rem;
            border-radius:8px;
            cursor:pointer;
        }
        .toast{
            position:fixed;
            bottom:2rem;
            left:50%;
            transform:translateX(-50%);
            background:var(--accent);
            color:#fff;
            padding:0.8rem 1.6rem;
            border-radius:8px;
            font-size:0.95rem;
            box-shadow:0 8px 24px rgba(0,0,0,0.3);
            z-index:999;
            opacity:0;
            transition:opacity 0.3s;
            pointer-events:none;
        }
        .toast.show{opacity:1;pointer-events:auto}
        .toast.error{background:#f87171}
        .empty-tip{text-align:center;color:var(--text-sub);padding:3rem 0;}
    </style>
</head>
<body>
    <nav>
        <div class="brand">S侦探社</div>
        <div class="nav-spacer"></div>
        <button id="themeToggle">切换明暗</button>
        <a href="dashboard.html">首页</a>
        <a href="personal.html">个人中心</a>
        <a href="forum.html">论坛</a>
        <button id="logoutBtn">退出登录</button>
    </nav>

    <main>
        <h2>论坛</h2>
        <div class="form-box">
            <h3>发布新帖子</h3>
            <input id="postTitle" placeholder="帖子标题">
            <textarea id="postContent" placeholder="写下你的内容..."></textarea>
            <button class="submit" id="sendPost">提交帖子</button>
        </div>
        <div id="postList"></div>
    </main>
    <div id="toast" class="toast"></div>

    <script>
        // ================== 主题切换 ==================
        (function initTheme() {
            const htmlRoot = document.documentElement;
            const themeBtn = document.getElementById('themeToggle');
            const saved = localStorage.getItem('site-theme');
            if (saved === 'light') htmlRoot.classList.add('light');
            themeBtn.addEventListener('click', function() {
                if (htmlRoot.classList.contains('light')) {
                    htmlRoot.classList.remove('light');
                    localStorage.setItem('site-theme', 'dark');
                } else {
                    htmlRoot.classList.add('light');
                    localStorage.setItem('site-theme', 'light');
                }
            });
        })();

        // ================== Toast ==================
        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast' + (isError ? ' error' : '');
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 3500);
        }

        function escapeHtml(s) {
            if (!s) return '';
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // ================== Supabase 配置（静态加载，同步初始化） ==================
        const SUPABASE_URL = "https://beskfflajjthquaqbbbe.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJlc2tmZmxhamp0aHF1YXFiYmJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NjYyMTEsImV4cCI6MjEwMTM0MjIxMX0.ky0o3pHQZ2NSY9fh_R6HjaJk_UONUujjpleBiQRU4zM";
        const STORAGE_KEY = 'sb-auth-token-sdetective';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                storageKey: STORAGE_KEY
            }
        });
        let myUid = null;
        let isAdmin = false;

        // ================== 退出登录 ==================
        document.getElementById('logoutBtn').addEventListener('click', async function() {
            if (confirm("确定退出登录？")) {
                await supabase.auth.signOut();
                localStorage.removeItem(STORAGE_KEY);
                location.href = "login.html";
            }
        });

        // ================== 删除帖子 ==================
        async function deletePost(postId) {
            if (!confirm("确认删除该帖子，帖子下全部评论会一并清除！")) return;
            const { error } = await supabase
                .from('forum_posts')
                .delete()
                .eq('id', postId);
            if (error) {
                showToast("删除帖子失败：" + error.message, true);
                return;
            }
            showToast("帖子已删除");
            loadPosts();
        }

        // ================== 加载帖子列表 ==================
        async function loadPosts() {
            const { data, error } = await supabase
                .from('forum_posts')
                .select('*,forum_comments(*)')
                .order('created_at', { ascending: false });

            const wrap = document.getElementById('postList');
            if (error) {
                wrap.innerHTML = `<div class="empty-tip">读取帖子失败：${error.message}</div>`;
                return;
            }
            if (!data || data.length === 0) {
                wrap.innerHTML = `<div class="empty-tip">还没有帖子，快来发布第一条！</div>`;
                return;
            }
            let html = '';
            data.forEach(p => {
                const nick = p.profiles?.nickname || "匿名侦探";
                const showDelPost = (p.user_id === myUid || isAdmin) ? `<button class="del-post-btn" data-postid="${p.id}">删除帖子</button>` : '';

                let commentHtml = '';
                if (p.forum_comments && p.forum_comments.length > 0) {
                    p.forum_comments.forEach(c => {
                        const cNick = c.profiles?.nickname || "匿名侦探";
                        const showDelComment = (c.user_id === myUid || isAdmin) ? `<button class="del-small" data-cid="${c.id}">删除</button>` : '';
                        commentHtml += `
                        <div class="comment-item">
                            <div class="comment-meta">${escapeHtml(cNick)}｜${new Date(c.created_at).toLocaleString()} ${showDelComment}</div>
                            <div>${escapeHtml(c.content)}</div>
                        </div>`;
                    });
                }

                html += `
                <div class="card" data-postid="${p.id}">
                    <div class="post-title">${escapeHtml(p.title)}</div>
                    <div class="post-meta">
                        ${escapeHtml(nick)}｜${new Date(p.created_at).toLocaleString()}
                        ${showDelPost}
                    </div>
                    <div class="post-content">${escapeHtml(p.content)}</div>
                    <button class="reply-btn" data-pid="${p.id}">回复</button>
                    <div class="reply-box" id="replybox-${p.id}">
                        <textarea class="reply-input" placeholder="写下你的回复..."></textarea>
                        <button class="submit send-reply" data-pid="${p.id}">发送回复</button>
                    </div>
                    <div class="comment-area">${commentHtml}</div>
                </div>`;
            });
            wrap.innerHTML = html;

            // 删除帖子
            document.querySelectorAll('.del-post-btn').forEach(btn => {
                btn.onclick = async function() {
                    const pid = this.dataset.postid;
                    await deletePost(pid);
                };
            });

            // 回复按钮展开
            document.querySelectorAll('.reply-btn').forEach(btn => {
                btn.onclick = function() {
                    const pid = this.dataset.pid;
                    const box = document.getElementById(`replybox-${pid}`);
                    box.classList.toggle('show');
                };
            });

            // 发送回复
            document.querySelectorAll('.send-reply').forEach(btn => {
                btn.onclick = async function() {
                    const pid = this.dataset.pid;
                    const box = document.getElementById(`replybox-${pid}`);
                    const textarea = box.querySelector('.reply-input');
                    const content = textarea.value.trim();
                    if (!content) { showToast("回复内容不能为空", true); return; }
                    const { error } = await supabase.from('forum_comments').insert({
                        post_id: pid,
                        user_id: myUid,
                        content: content
                    });
                    if (error) { showToast("回复失败：" + error.message, true); return; }
                    showToast("回复成功");
                    await loadPosts();
                };
            });

            // 删除评论
            document.querySelectorAll('.del-small').forEach(btn => {
                btn.onclick = async function() {
                    const cid = this.dataset.cid;
                    if (!confirm("确定删除这条回复？")) return;
                    const { error } = await supabase.from('forum_comments').delete().eq('id', cid);
                    if (error) { showToast("删除失败", true); return; }
                    await loadPosts();
                };
            });
        }

        // ================== 发布帖子 ==================
        document.getElementById('sendPost').addEventListener('click', async function() {
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();
            if (!title || !content) {
                showToast('标题和内容不能为空', true);
                return;
            }
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) { showToast("未登录", true); return; }
            const { error } = await supabase.from('forum_posts').insert({
                user_id: user.id,
                title: title,
                content: content
            });
            if (error) {
                showToast('发布失败：' + error.message, true);
                return;
            }
            showToast('发布成功！');
            document.getElementById('postTitle').value = '';
            document.getElementById('postContent').value = '';
            loadPosts();
        });

        // ================== 初始化（安全检测，不自动跳转） ==================
        async function init() {
            // 等待会话恢复，最多 3 秒
            let waitCount = 0;
            let session = null;
            while (waitCount < 30) {
                try {
                    const res = await supabase.auth.getSession();
                    session = res.data.session;
                    if (session) break;
                } catch (e) {
                    console.warn("获取会话失败:", e);
                }
                waitCount++;
                await new Promise(r => setTimeout(r, 100));
            }

            if (!session) {
                showToast("未登录，请先登录", true);
                setTimeout(() => location.replace("login.html"), 600);
                return;
            }

            const user = session.user;
            myUid = user.id;

            const { data: profile } = await supabase.from('profiles').select('is_admin').eq('id', user.id).single();
            isAdmin = !!profile?.is_admin;

            await loadPosts();
        }

        init();

        // 监听会话变化（只提示，不自动跳转，由上面的 init 统一处理）
        supabase.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_OUT' || (event === 'TOKEN_REFRESHED' && !session)) {
                showToast('登录会话已过期，请重新登录', true);
                setTimeout(() => location.replace('login.html'), 800);
            }
        });
    </script>
</body>
</html>
