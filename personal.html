<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S侦探社｜个人中心</title>
    <style>
        /* 样式略（同之前，保持简洁） */
        :root {
            --bg-primary: #0b0c10;
            --text-main: #f2f3f7;
            --text-sub: #989ca8;
            --accent: #7398ff;
            --accent-fade: rgba(115, 152, 255, 0.12);
            --border-fade: rgba(255, 255, 255, 0.08);
            --transition: all 0.28s ease;
        }
        html.light {
            --bg-primary: #f7f8fc;
            --text-main: #11141c;
            --text-sub: #595d6b;
            --accent: #507ee8;
            --accent-fade: rgba(80, 126, 232, 0.12);
            --border-fade: rgba(0, 0, 0, 0.1);
        }
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, -apple-system, sans-serif}
        body{background:var(--bg-primary);color:var(--text-main);min-height:100vh;transition: var(--transition)}
        nav{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;padding:1.2rem 5%;border-bottom:1px solid var(--border-fade)}
        .brand{font-size:1.4rem;font-weight:bold}
        .nav-spacer{flex:1}
        nav button, nav a{
            background:transparent;
            color:var(--text-main);
            border:1px solid var(--border-fade);
            padding:0.5rem 1rem;
            border-radius:8px;
            text-decoration:none;
            cursor:pointer;
            transition:var(--transition);
        }
        nav button:hover, nav a:hover{
            border-color:var(--accent);
            background:var(--accent-fade);
        }
        main{max-width:1000px;margin:3rem auto;padding:0 5%}
        h2{margin-bottom:1.2rem}
        .card{
            border:1px solid var(--border-fade);
            border-radius:12px;
            padding:1.6rem;
            margin-bottom:1.5rem;
            transition:var(--transition);
        }
        .card:hover{border-color:var(--accent)}
        .info-row{margin:0.7rem 0;font-size:1rem}
        .label{color:var(--text-sub);margin-right:0.5rem}
        input{
            width:100%;
            background:transparent;
            color:var(--text-main);
            border:1px solid var(--border-fade);
            border-radius:8px;
            padding:0.7rem;
            margin:0.6rem 0;
        }
        .btn{
            background:var(--accent);
            color:white;
            border:none;
            padding:0.6rem 1.2rem;
            border-radius:8px;
            cursor:pointer;
        }
        .toast{
            position:fixed;
            bottom:2rem;
            left:50%;
            transform:translateX(-50%);
            background:var(--accent);
            color:#fff;
            padding:0.8rem 1.6rem;
            border-radius:8px;
            font-size:0.95rem;
            box-shadow:0 8px 24px rgba(0,0,0,0.3);
            z-index:999;
            opacity:0;
            transition:opacity 0.3s;
            pointer-events:none;
        }
        .toast.show{opacity:1;pointer-events:auto}
        .toast.error{background:#f87171}
    </style>
</head>
<body>
    <nav>
        <div class="brand">S侦探社</div>
        <div class="nav-spacer"></div>
        <button id="themeToggle">切换明暗</button>
        <a href="dashboard.html">首页</a>
        <a href="personal.html">个人中心</a>
        <a href="forum.html">论坛</a>
        <button id="logoutBtn">退出登录</button>
    </nav>

    <main>
        <h2>个人中心</h2>
        <div class="card">
            <div class="info-row"><span class="label">用户ID：</span><span id="uid">—</span></div>
            <div class="info-row"><span class="label">邮箱：</span><span id="email">—</span></div>
            <div class="info-row"><span class="label">注册时间：</span><span id="createdAt">—</span></div>
            <hr style="margin:1rem 0;border-color:var(--border-fade)">
            <div class="info-row"><span class="label">昵称：</span></div>
            <input id="nickInput" placeholder="设置你的昵称">
            <button class="btn" id="saveNick">保存昵称</button>
        </div>
        <div id="debugInfo" style="margin-top:1.5rem;padding:0.8rem;background:rgba(255,255,255,0.05);border-radius:8px;font-size:0.85rem;border:1px solid var(--border-fade);white-space:pre-wrap;word-break:break-word;color:var(--text-sub);min-height:100px;"></div>
    </main>
    <div id="toast" class="toast"></div>

    <script>
        // ================== 调试工具（记录到页面 + alert） ==================
        const debugEl = document.getElementById('debugInfo');
        function logAndAlert(msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const line = `[${time}] ${msg}`;
            console.log(line);
            // 显示在页面上
            const div = document.createElement('div');
            div.textContent = line;
            if (type === 'error') div.style.color = '#f87171';
            else if (type === 'success') div.style.color = '#6ee7b7';
            else if (type === 'warn') div.style.color = '#fbbf24';
            debugEl.appendChild(div);
            debugEl.scrollTop = debugEl.scrollHeight;
            // 同时弹窗提醒（手机可见）
            alert(msg);
        }
        logAndAlert('🚀 页面加载开始');

        // ================== 主题 ==================
        (function initTheme() {
            const htmlRoot = document.documentElement;
            const themeBtn = document.getElementById('themeToggle');
            const saved = localStorage.getItem('site-theme');
            if (saved === 'light') htmlRoot.classList.add('light');
            themeBtn.addEventListener('click', function() {
                htmlRoot.classList.toggle('light');
                localStorage.setItem('site-theme', htmlRoot.classList.contains('light') ? 'light' : 'dark');
            });
        })();

        // ================== Toast ==================
        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast' + (isError ? ' error' : '');
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 3500);
        }

        // ================== Supabase 配置 ==================
        const SUPABASE_URL = "https://beskfflajjthquaqbbbe.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJlc2tmZmxhamp0aHF1YXFiYmJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NjYyMTEsImV4cCI6MjEwMTM0MjIxMX0.ky0o3pHQZ2NSY9fh_R6HjaJk_UONUujjpleBiQRU4zM";
        const STORAGE_KEY = 'sb-auth-token-sdetective';
        let supabase = null;

        // ================== 加载 SDK ==================
        function loadSupabase() {
            return new Promise((resolve) => {
                logAndAlert('⏳ 开始加载 Supabase SDK...');
                const script = document.createElement('script');
                script.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1/dist/umd/supabase.js";
                script.onload = ()=>{
                    logAndAlert('✅ 主 CDN 加载成功', 'success');
                    try {
                        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                            auth: {
                                persistSession: true,
                                autoRefreshToken: true,
                                storageKey: STORAGE_KEY
                            }
                        });
                        logAndAlert('✅ Supabase 客户端创建成功', 'success');
                        resolve(true);
                    } catch (err) {
                        logAndAlert('❌ 创建客户端失败: ' + err.message, 'error');
                        resolve(false);
                    }
                };
                script.onerror = ()=>{
                    logAndAlert('⚠️ 主 CDN 失败，尝试备用源', 'warn');
                    const fb = document.createElement('script');
                    fb.src = "https://unpkg.com/@supabase/supabase-js@2.45.1/dist/umd/supabase.js";
                    fb.onload = ()=>{
                        logAndAlert('✅ 备用 CDN 加载成功', 'success');
                        try {
                            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                                auth: {
                                    persistSession: true,
                                    autoRefreshToken: true,
                                    storageKey: STORAGE_KEY
                                }
                            });
                            logAndAlert('✅ Supabase 客户端创建成功', 'success');
                            resolve(true);
                        } catch (err) {
                            logAndAlert('❌ 创建客户端失败: ' + err.message, 'error');
                            resolve(false);
                        }
                    };
                    fb.onerror = ()=>{
                        logAndAlert('❌ 所有 CDN 加载失败', 'error');
                        resolve(false);
                    };
                    document.head.appendChild(fb);
                };
                document.head.appendChild(script);
            });
        }

        // ================== 退出登录 ==================
        document.getElementById('logoutBtn').addEventListener('click', async function() {
            if (supabase && confirm("确定退出登录？")) {
                await supabase.auth.signOut();
            }
            location.href = "login.html";
        });

        // ================== 保存昵称 ==================
        document.getElementById('saveNick').addEventListener('click', async function() {
            const nick = document.getElementById('nickInput').value.trim();
            if (!nick) { showToast("昵称不能为空", true); return; }
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) { showToast("未登录", true); return; }
            const { error } = await supabase.from('profiles').update({ nickname: nick }).eq('id', user.id);
            if (error) { showToast("保存失败：" + error.message, true); return; }
            showToast("昵称保存成功！");
        });

        // ================== 主初始化 ==================
        async function init() {
            logAndAlert('🔄 初始化开始...');

            // 1. 加载 SDK
            const sdkOk = await loadSupabase();
            if (!sdkOk) {
                logAndAlert('❌ SDK 加载失败，页面无法继续', 'error');
                showToast('SDK 加载失败，请刷新重试', true);
                return;
            }

            // 2. 检查 localStorage 中是否有 token
            const token = localStorage.getItem(STORAGE_KEY);
            logAndAlert(`📦 存储键 "${STORAGE_KEY}" 的值: ${token ? '存在 (长度 ' + token.length + ')' : '不存在'}`);

            // 3. 尝试获取会话，等待最多 3 秒
            let session = null;
            let attempts = 0;
            while (attempts < 30) {
                try {
                    const res = await supabase.auth.getSession();
                    session = res.data.session;
                    if (session) {
                        logAndAlert(`✅ 成功获取会话 (第 ${attempts+1} 次尝试)`, 'success');
                        break;
                    }
                } catch (e) {
                    logAndAlert(`⚠️ 获取会话异常 (第 ${attempts+1} 次): ${e.message}`, 'warn');
                }
                attempts++;
                await new Promise(r => setTimeout(r, 100));
            }

            if (!session) {
                logAndAlert('❌ 未检测到登录会话，即将跳转到登录页', 'error');
                showToast('未登录，跳转登录页', true);
                // 延迟跳转，让用户看到弹窗
                setTimeout(() => location.replace("login.html"), 2000);
                return;
            }

            // 4. 显示用户信息
            const user = session.user;
            logAndAlert(`👤 已登录用户: ${user.email} (${user.id})`, 'success');
            document.getElementById('uid').textContent = user.id;
            document.getElementById('email').textContent = user.email;
            document.getElementById('createdAt').textContent = new Date(user.created_at).toLocaleString();

            // 5. 读取昵称
            try {
                const { data: prof, error } = await supabase
                    .from('profiles')
                    .select('nickname')
                    .eq('id', user.id)
                    .single();
                if (error) {
                    logAndAlert(`⚠️ 读取 profiles 表出错: ${error.message}`, 'warn');
                    showToast('读取昵称失败: ' + error.message, true);
                } else if (prof) {
                    logAndAlert(`✅ 昵称读取成功: ${prof.nickname || '(未设置)'}`, 'success');
                    document.getElementById('nickInput').value = prof.nickname || '';
                } else {
                    logAndAlert('⚠️ profiles 表中没有该用户记录', 'warn');
                    showToast('用户资料不存在，请先联系管理员', true);
                }
            } catch (err) {
                logAndAlert(`❌ 读取 profiles 表异常: ${err.message}`, 'error');
                showToast('读取资料异常', true);
            }

            logAndAlert('✅ 个人中心初始化完成', 'success');
        }

        // 执行
        init();

        // 监听会话变化
        supabase.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_OUT' || (event === 'TOKEN_REFRESHED' && !session)) {
                logAndAlert('🔴 会话失效，跳转登录页', 'error');
                showToast('登录会话已过期，请重新登录', true);
                setTimeout(() => location.replace('login.html'), 800);
            }
        });
    </script>
</body>
</html>
