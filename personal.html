<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S侦探社｜个人中心</title>
    <style>
        :root {
            --bg-primary: #0b0c10;
            --text-main: #f2f3f7;
            --text-sub: #989ca8;
            --accent: #7398ff;
            --accent-fade: rgba(115, 152, 255, 0.12);
            --border-fade: rgba(255, 255, 255, 0.08);
            --transition: all 0.28s ease;
        }
        html.light {
            --bg-primary: #f7f8fc;
            --text-main: #11141c;
            --text-sub: #595d6b;
            --accent: #507ee8;
            --accent-fade: rgba(80, 126, 232, 0.12);
            --border-fade: rgba(0, 0, 0, 0.1);
        }
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, -apple-system, sans-serif}
        body{background:var(--bg-primary);color:var(--text-main);min-height:100vh;transition: var(--transition)}
        nav{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;padding:1.2rem 5%;border-bottom:1px solid var(--border-fade)}
        .brand{font-size:1.4rem;font-weight:bold}
        .nav-spacer{flex:1}
        nav button, nav a{
            background:transparent;
            color:var(--text-main);
            border:1px solid var(--border-fade);
            padding:0.5rem 1rem;
            border-radius:8px;
            text-decoration:none;
            cursor:pointer;
            transition:var(--transition);
        }
        nav button:hover, nav a:hover{
            border-color:var(--accent);
            background:var(--accent-fade);
        }
        main{max-width:1000px;margin:3rem auto;padding:0 5%}
        h2{margin-bottom:1.2rem}
        .card{
            border:1px solid var(--border-fade);
            border-radius:12px;
            padding:1.6rem;
            margin-bottom:1.5rem;
            transition:var(--transition);
        }
        .card:hover{border-color:var(--accent)}
        .info-row{margin:0.7rem 0;font-size:1rem}
        .label{color:var(--text-sub);margin-right:0.5rem}
        .toast{
            position:fixed;
            bottom:2rem;
            left:50%;
            transform:translateX(-50%);
            background:var(--accent);
            color:#fff;
            padding:0.8rem 1.6rem;
            border-radius:8px;
            font-size:0.95rem;
            box-shadow:0 8px 24px rgba(0,0,0,0.3);
            z-index:999;
            opacity:0;
            transition:opacity 0.3s;
            pointer-events:none;
        }
        .toast.show{opacity:1;pointer-events:auto}
        .toast.error{background:#f87171}
    </style>
</head>
<body>
    <nav>
        <div class="brand">S侦探社</div>
        <div class="nav-spacer"></div>
        <button id="themeToggle">切换明暗</button>
        <a href="dashboard.html">首页</a>
        <a href="personal.html">个人中心</a>
        <a href="forum.html">论坛</a>
        <button id="logoutBtn">退出登录</button>
    </nav>

    <main>
        <h2>个人中心</h2>
        <div class="card">
            <div class="info-row"><span class="label">用户ID：</span><span id="uid">—</span></div>
            <div class="info-row"><span class="label">邮箱：</span><span id="email">—</span></div>
            <div class="info-row"><span class="label">注册时间：</span><span id="createdAt">—</span></div>
        </div>
    </main>
    <div id="toast" class="toast"></div>

    <script>
        // 独立明暗切换
        (function initTheme() {
            const htmlRoot = document.documentElement;
            const themeBtn = document.getElementById('themeToggle');
            const saved = localStorage.getItem('site-theme');
            if (saved === 'light') htmlRoot.classList.add('light');
            themeBtn.addEventListener('click', function() {
                if (htmlRoot.classList.contains('light')) {
                    htmlRoot.classList.remove('light');
                    localStorage.setItem('site-theme', 'dark');
                } else {
                    htmlRoot.classList.add('light');
                    localStorage.setItem('site-theme', 'light');
                }
            });
        })();

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast' + (isError ? ' error' : '');
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 3500);
        }

        const SUPABASE_URL = "https://beskfflajjthquaqbbbe.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJlc2tmZmxhamp0aHF1YXFiYmJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NjYyMTEsImV4cCI6MjEwMTM0MjIxMX0.ky0o3pHQZ2NSY9fh_R6HjaJk_UONUujjpleBiQRU4zM";
        let supabase = null;

        function loadSupabase() {
            return new Promise((resolve) => {
                const script = document.createElement('script');
                script.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1/dist/umd/supabase.js";
                script.onload = ()=>{
                    supabase = window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
                    resolve(true);
                }
                script.onerror = ()=>{
                    const fb = document.createElement('script');
                    fb.src = "https://unpkg.com/@supabase/supabase-js@2.45.1/dist/umd/supabase.js";
                    fb.onload = ()=>{
                        supabase = window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
                        resolve(true);
                    }
                    fb.onerror = resolve(false);
                    document.head.appendChild(fb);
                }
                document.head.appendChild(script);
            })
        }

        document.getElementById('logoutBtn').addEventListener('click',async function(){
            if(supabase && confirm("确定退出登录？")){
                await supabase.auth.signOut();
            }
            location.href="index.html";
        })

        async function init(){
            const ok = await loadSupabase();
            if(!ok) return;
            const {data:{user}} = await supabase.auth.getUser();
            if(!user){
                showToast("未登录，跳转登录页",true);
                setTimeout(()=>location.replace("login.html"),600);
                return;
            }
            document.getElementById("uid").textContent = user.id;
            document.getElementById("email").textContent = user.email;
            document.getElementById("createdAt").textContent = new Date(user.created_at).toLocaleString();
        }
        init();
    </script>
</body>
</html>
