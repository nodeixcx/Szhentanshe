<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 | S侦探社</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        :root {
            --bg-primary: #0b0c10;
            --text-main: #f2f3f7;
            --text-sub: #989ca8;
            --accent: #7398ff;
            --accent-fade: rgba(115, 152, 255, 0.12);
            --border-fade: rgba(255, 255, 255, 0.08);
            --card-bg: rgba(255,255,255,0.03);
            --transition: all 0.28s ease;
        }
        html.light {
            --bg-primary: #f7f8fc;
            --text-main: #11141c;
            --text-sub: #595d6b;
            --accent: #507ee8;
            --accent-fade: rgba(80, 126, 232, 0.1);
            --border-fade: rgba(0, 0, 0, 0.1);
            --card-bg: #ffffff;
        }
        body {
            background: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            transition: var(--transition);
        }
        .login-wrap {
            width: 100%;
            max-width: 440px;          /* 稍微放宽一点 */
            border: 1px solid var(--border-fade);
            border-radius: 16px;
            background: var(--card-bg);
            padding: 2.6rem 2rem;      /* 左右内边距加大 */
        }
        .logo {
            text-align: center;
            font-size: 1.5rem;
            letter-spacing: 1px;
            margin-bottom: 2rem;
        }
        .tab-bar {
            display: flex;
            border-bottom: 1px solid var(--border-fade);
            margin-bottom: 2rem;
        }
        .tab-item {
            flex: 1;
            text-align: center;
            padding: 0.8rem;
            cursor: pointer;
            color: var(--text-sub);
            position: relative;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            font-size: 0.95rem;
        }
        .tab-item.active {
            color: var(--accent);
        }
        .tab-item.active::after {
            content: "";
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent);
        }
        .form-panel {
            display: none;
        }
        .form-panel.show {
            display: block;
        }
        .input-item {
            margin-bottom: 1.4rem;    /* 间距加大 */
        }
        .input-item label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.92rem;
            color: var(--text-sub);
        }
        .input-item input {
            width: 100%;
            padding: 0.9rem 1rem;      /* 上下内边距加大 */
            background: transparent;
            border: 1px solid var(--border-fade);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            /* ✅ 关键修复：文字不溢出 */
            box-sizing: border-box;
            min-width: 0;
        }
        .input-item input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-fade);
        }
        /* ✅ 针对输入框内文字显示不全的修复 */
        .input-item input::placeholder {
            color: var(--text-sub);
            opacity: 0.7;
            font-size: 0.95rem;
        }
        .input-item input {
            text-overflow: clip;       /* 不显示省略号，允许换行 */
            overflow: visible;
            word-break: break-all;
        }
        .remember-row {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1.2rem;
        }
        .remember-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            flex-shrink: 0;
        }
        .remember-row label {
            font-size: 0.9rem;
            color: var(--text-sub);
            cursor: pointer;
        }
        .submit-btn {
            width: 100%;
            padding: 0.9rem;
            border-radius: 10px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: opacity 0.2s, transform 0.15s;
            -webkit-tap-highlight-color: transparent;
            letter-spacing: 0.5px;
        }
        .submit-btn:active {
            opacity: 0.8;
            transform: scale(0.98);
        }
        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .msg-tip {
            margin-top: 1.2rem;
            font-size: 0.9rem;
            text-align: center;
            color: var(--text-sub);
            min-height: 1.8rem;
        }
        .msg-tip.error {
            color: #f87171;
        }
        .msg-tip.success {
            color: #6ee7b7;
        }
        .debug-console {
            margin-top: 1.5rem;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            font-size: 0.75rem;
            color: var(--text-sub);
            border: 1px solid var(--border-fade);
            word-break: break-all;
            max-height: 80px;
            overflow-y: auto;
            display: none;
        }
        .debug-console.show {
            display: block;
        }
        .debug-console .log-line {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .debug-console .log-line:last-child {
            border-bottom: none;
        }

        /* ===== 移动端优化 ===== */
        @media (max-width: 480px) {
            .login-wrap {
                padding: 1.8rem 1.2rem;
            }
            .input-item input {
                padding: 0.8rem 0.9rem;
                font-size: 0.95rem;
            }
            .submit-btn {
                font-size: 1rem;
                padding: 0.8rem;
            }
            .tab-item {
                font-size: 0.85rem;
                padding: 0.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="logo">S侦探社</div>
        <div class="tab-bar">
            <div class="tab-item active" data-tab="login">已有账号 · 登录</div>
            <div class="tab-item" data-tab="register">新用户 · 注册</div>
        </div>

        <!-- 登录表单 -->
        <form autocomplete="on">
            <div class="form-panel show" id="panel-login">
                <div class="input-item">
                    <label>邮箱</label>
                    <input name="email" type="email" id="login-email" autocomplete="username" placeholder="your@mail.com">
                </div>
                <div class="input-item">
                    <label>密码</label>
                    <input name="password" type="password" id="login-pwd" autocomplete="current-password" placeholder="输入密码">
                </div>
                <div class="remember-row">
                    <input type="checkbox" id="rememberMail">
                    <label for="rememberMail">记住邮箱（下次自动填充）</label>
                </div>
                <button type="submit" class="submit-btn" id="btn-login" disabled>🔑 登录进入</button>
                <div class="msg-tip" id="login-msg"></div>
            </div>
        </form>

        <!-- 注册表单 -->
        <form autocomplete="on">
            <div class="form-panel" id="panel-register">
                <div class="input-item">
                    <label>邮箱</label>
                    <input name="reg_email" type="email" id="reg-email" placeholder="your@mail.com">
                </div>
                <div class="input-item">
                    <label>设置密码</label>
                    <input name="reg_pwd" type="password" id="reg-pwd" autocomplete="new-password" placeholder="至少6位字符">
                </div>
                <div class="input-item">
                    <label>确认密码</label>
                    <input name="reg_pwd2" type="password" id="reg-pwd2" autocomplete="new-password" placeholder="再次输入密码">
                </div>
                <button type="button" class="submit-btn" id="btn-register" disabled>📝 创建账号</button>
                <div class="msg-tip" id="reg-msg"></div>
            </div>
        </form>

        <div class="debug-console" id="debugPanel"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const debugPanel = document.getElementById('debugPanel');
            const loginMsg = document.getElementById('login-msg');
            const regMsg = document.getElementById('reg-msg');
            const loginEmail = document.getElementById('login-email');
            const loginPwd = document.getElementById('login-pwd');
            const rememberMail = document.getElementById('rememberMail');
            const regEmail = document.getElementById('reg-email');
            const regPwd = document.getElementById('reg-pwd');
            const regPwd2 = document.getElementById('reg-pwd2');
            const btnLogin = document.getElementById('btn-login');
            const btnRegister = document.getElementById('btn-register');
            const tabs = document.querySelectorAll('.tab-item');

            if (!debugPanel || !btnLogin || !btnRegister) {
                alert('❌ 页面加载异常，关键元素缺失，请刷新重试');
                return;
            }

            let logCount = 0;
            const savedMail = localStorage.getItem('saved_login_mail');
            if(savedMail){
                loginEmail.value = savedMail;
                rememberMail.checked = true;
            }

            function logDebug(msg, isError = false, isWarn = false) {
                logCount++;
                const time = new Date().toLocaleTimeString();
                const line = `[${time}] ${msg}`;
                console.log(line);
                try {
                    debugPanel.classList.add('show');
                    const div = document.createElement('div');
                    div.className = 'log-line';
                    let color = '';
                    if (isError) color = 'color:#f87171;';
                    else if (isWarn) color = 'color:#fbbf24;';
                    else color = 'color:var(--text-sub);';
                    div.style.cssText = color;
                    div.textContent = line;
                    debugPanel.appendChild(div);
                    if (logCount > 50) debugPanel.querySelector('.log-line').remove();
                    debugPanel.scrollTop = debugPanel.scrollHeight;
                } catch (e) { console.warn('调试面板写入失败:', e); }
            }

            logDebug('🚀 页面初始化开始...');

            let supabase = null;
            let sdkReady = false;
            const SUPABASE_URL = "https://beskfflajjthquaqbbbe.supabase.co";
            const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJlc2tmZmxhamp0aHF1YXFiYmJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NjYyMTEsImV4cCI6MjEwMTM0MjIxMX0.ky0o3pHQZ2NSY9fh_R6HjaJk_UONUujjpleBiQRU4zM";
            const STORAGE_KEY = 'sb-auth-token-sdetective';

            function initSupabase(){
                try{
                    if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
                        const { createClient } = window.supabase;
                        supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                            auth: {
                                persistSession: true,
                                autoRefreshToken: true,
                                storageKey: STORAGE_KEY
                            }
                        });
                        sdkReady = true;
                        btnLogin.disabled = false;
                        btnRegister.disabled = false;
                        logDebug('✅ Supabase SDK 加载成功，持久会话开启');
                        supabase.auth.onAuthStateChange((event, session) => {
                            if(event === 'SIGNED_OUT' || (event === 'TOKEN_REFRESHED' && !session)){
                                logDebug('⚠️ 会话失效，跳转登录页');
                            }
                        });
                    } else {
                        logDebug('❌ window.supabase 不存在', true);
                    }
                } catch(err) {
                    logDebug('❌ initSupabase异常:' + err.message, true);
                }
            }

            // 加载 SDK
            const script1 = document.createElement('script');
            script1.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1/dist/umd/supabase.js";
            script1.onload = function(){
                logDebug('📦 源1 cdn.jsdelivr.net 加载完成');
                initSupabase();
                if(!sdkReady){
                    logDebug('🔄 源1无效，切换备用源unpkg', false, true);
                    const script2 = document.createElement('script');
                    script2.src = "https://unpkg.com/@supabase/supabase.js";
                    script2.onload = function(){ logDebug('📦 源2 unpkg加载完成'); initSupabase(); };
                    script2.onerror = function(){ logDebug('❌ 两个CDN全部加载失败，请关闭广告拦截/切换网络', true); };
                    document.head.appendChild(script2);
                }
            };
            script1.onerror = function(){
                logDebug('❌ 源1 cdn.jsdelivr.net加载失败，切换备用源unpkg', false, true);
                const script2 = document.createElement('script');
                script2.src = "https://unpkg.com/@supabase/supabase.js";
                script2.onload = function(){ logDebug('📦 源2 unpkg加载完成'); initSupabase(); };
                script2.onerror = function(){ logDebug('❌ 两个CDN全部加载失败，请关闭广告拦截/切换网络', true); };
                document.head.appendChild(script2);
            };
            document.head.appendChild(script1);

            // 占位对象
            if (!supabase) {
                supabase = {
                    auth: {
                        signInWithPassword: async () => ({ data: null, error: { message: 'SDK 未就绪，请稍后重试' } }),
                        signUp: async () => ({ data: null, error: { message: 'SDK 未就绪，请稍后重试' } }),
                        getUser: async () => ({ data: { user: null }, error: null }),
                        onAuthStateChange: () => {}
                    }
                };
                if (!sdkReady) logDebug('⚠️ 使用占位 Supabase 对象，SDK 还未加载', false, true);
            }

            // Tab 切换
            tabs.forEach(t => {
                t.addEventListener('click', function() {
                    tabs.forEach(x => x.classList.remove('active'));
                    this.classList.add('active');
                    const tabName = this.dataset.tab;
                    document.getElementById('panel-login').classList.toggle('show', tabName === 'login');
                    document.getElementById('panel-register').classList.toggle('show', tabName === 'register');
                    logDebug(`🔄 切换到: ${tabName}`);
                });
            });

            // 登录表单提交拦截
            document.querySelector('form').addEventListener('submit', e => {
                e.preventDefault();
                btnLogin.click();
            });

            // 登录按钮
            btnLogin.addEventListener('click', async function(e) {
                e.preventDefault();
                logDebug('🔵 点击了【登录】按钮');
                const email = loginEmail.value.trim();
                const pwd = loginPwd.value;
                loginMsg.className = 'msg-tip';
                loginMsg.innerText = '⏳ 登录中...';

                if (!email || !pwd) {
                    loginMsg.className = 'msg-tip error';
                    loginMsg.innerText = '⚠️ 请填写完整邮箱和密码';
                    logDebug('⚠️ 登录信息不完整', true);
                    return;
                }

                if (rememberMail.checked) {
                    localStorage.setItem('saved_login_mail', email);
                } else {
                    localStorage.removeItem('saved_login_mail');
                }

                if (!sdkReady) {
                    loginMsg.className = 'msg-tip error';
                    loginMsg.innerText = '⚠️ SDK正在加载，CDN被拦截，请关闭广告拦截或切换网络';
                    logDebug('⚠️ SDK 未就绪，无法登录', true);
                    return;
                }

                try {
                    const { data, error } = await supabase.auth.signInWithPassword({ email, password: pwd });
                    if (error) {
                        loginMsg.className = 'msg-tip error';
                        loginMsg.innerText = '❌ ' + error.message;
                        logDebug('❌ 登录失败: ' + error.message, true);
                        return;
                    }
                    loginMsg.className = 'msg-tip success';
                    loginMsg.innerText = '✅ 登录成功，会话自动保存，免登生效';
                    logDebug('✅ 登录成功，跳转到 dashboard.html');
                    setTimeout(() => location.replace("dashboard.html"), 500);
                } catch (err) {
                    loginMsg.className = 'msg-tip error';
                    loginMsg.innerText = '⚠️ 请求异常: ' + err.message;
                    logDebug('❌ 登录异常: ' + err.message, true);
                }
            });

            // 注册按钮
            btnRegister.addEventListener('click', async function(e) {
                e.preventDefault();
                logDebug('🟢 点击了【注册】按钮');
                const email = regEmail.value.trim();
                const pwd = regPwd.value;
                const pwd2 = regPwd2.value;
                regMsg.className = 'msg-tip';
                regMsg.innerText = '⏳ 注册中...';

                if (!email || !pwd || !pwd2) {
                    regMsg.className = 'msg-tip error';
                    regMsg.innerText = '⚠️ 请完整填写所有字段';
                    logDebug('⚠️ 注册信息不完整', true);
                    return;
                }
                if (pwd !== pwd2) {
                    regMsg.className = 'msg-tip error';
                    regMsg.innerText = '⚠️ 两次密码不一致';
                    logDebug('⚠️ 密码不一致', true);
                    return;
                }
                if (pwd.length < 6) {
                    regMsg.className = 'msg-tip error';
                    regMsg.innerText = '⚠️ 密码至少6位';
                    logDebug('⚠️ 密码太短', true);
                    return;
                }
                if (!sdkReady) {
                    regMsg.className = 'msg-tip error';
                    regMsg.innerText = '⚠️ SDK正在加载，关闭广告拦截';
                    logDebug('⚠️ SDK 未就绪', true);
                    return;
                }

                try {
                    const { data, error } = await supabase.auth.signUp({ email, password: pwd });
                    if (error) {
                        regMsg.className = 'msg-tip error';
                        regMsg.innerText = '❌ ' + error.message;
                        logDebug('❌ 注册失败: ' + error.message, true);
                        return;
                    }
                    regMsg.className = 'msg-tip success';
                    regMsg.innerText = '✅ 注册成功，请查收邮箱验证';
                    logDebug('✅ 注册成功，邮件已发送');
                    regEmail.value = '';
                    regPwd.value = '';
                    regPwd2.value = '';
                } catch (err) {
                    regMsg.className = 'msg-tip error';
                    regMsg.innerText = '⚠️ 请求异常: ' + err.message;
                    logDebug('❌ 注册异常: ' + err.message, true);
                }
            });

            // 回车提交
            document.querySelectorAll('input').forEach(inp => {
                inp.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        const panel = this.closest('.form-panel');
                        if (panel) panel.querySelector('.submit-btn').click();
                    }
                });
            });

            // 自动登录检测（轮询等待 SDK）
            (async function checkAuth() {
                let retry = 0;
                const maxRetry = 30;
                const interval = setInterval(async () => {
                    if (sdkReady) {
                        clearInterval(interval);
                        try {
                            const { data: { session } } = await supabase.auth.getSession();
                            if (session) {
                                logDebug(`👤 已存在免登会话: ${session.user.email}，直接跳转主页`);
                                location.replace("dashboard.html");
                            } else {
                                logDebug('👤 无保存登录，停留在登录页');
                            }
                        } catch (err) {
                            logDebug('⚠️ 检查登录状态失败: ' + err.message, true);
                        }
                    } else if (retry++ >= maxRetry) {
                        clearInterval(interval);
                        logDebug('⏳ SDK 加载超时，请手动登录', false, true);
                    }
                }, 100);
            })();

            logDebug('✅ 所有绑定完成');
        });
    </script>
</body>
</html>
