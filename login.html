<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 | S侦探社</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        :root {
            --bg-primary: #0b0c10;
            --text-main: #f2f3f7;
            --text-sub: #989ca8;
            --accent: #7398ff;
            --accent-fade: rgba(115, 152, 255, 0.12);
            --border-fade: rgba(255, 255, 255, 0.08);
            --card-bg: rgba(255,255,255,0.03);
            --transition: all 0.28s ease;
        }
        html.light {
            --bg-primary: #f7f8fc;
            --text-main: #11141c;
            --text-sub: #595d6b;
            --accent: #507ee8;
            --accent-fade: rgba(80, 126, 232, 0.1);
            --border-fade: rgba(0, 0, 0, 0.1);
            --card-bg: #ffffff;
        }
        body {
            background: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:2rem 1rem;
            transition: var(--transition);
        }
        .login-wrap{
            width:100%;
            max-width:420px;
            border:1px solid var(--border-fade);
            border-radius:14px;
            background:var(--card-bg);
            padding:2.4rem;
        }
        .logo{
            text-align:center;
            font-size:1.5rem;
            letter-spacing:1px;
            margin-bottom:2rem;
        }
        .tab-bar{
            display:flex;
            border-bottom:1px solid var(--border-fade);
            margin-bottom:1.8rem;
        }
        .tab-item{
            flex:1;
            text-align:center;
            padding:0.8rem;
            cursor:pointer;
            color:var(--text-sub);
            position:relative;
            -webkit-tap-highlight-color: transparent;
        }
        .tab-item.active{
            color:var(--accent);
        }
        .tab-item.active::after{
            content:"";
            position:absolute;
            bottom:-1px;
            left:0;
            width:100%;
            height:2px;
            background:var(--accent);
        }
        .form-panel{
            display:none;
        }
        .form-panel.show{
            display:block;
        }
        .input-item{
            margin-bottom:1.2rem;
        }
        .input-item label{
            display:block;
            margin-bottom:0.5rem;
            font-size:0.92rem;
            color:var(--text-sub);
        }
        .input-item input{
            width:100%;
            padding:0.85rem 1rem;
            background:transparent;
            border:1px solid var(--border-fade);
            border-radius:8px;
            color:var(--text-main);
            font-size:1rem;
        }
        .submit-btn{
            width:100%;
            padding:0.9rem;
            border-radius:8px;
            border:none;
            background:var(--accent);
            color:#fff;
            font-size:1rem;
            cursor:pointer;
            margin-top:0.5rem;
            -webkit-tap-highlight-color: transparent;
        }
        .msg-tip{
            margin-top:1rem;
            font-size:0.9rem;
            text-align:center;
            color:var(--text-sub);
        }
    </style>
</head>
<body>
<div class="login-wrap">
    <div class="logo">S侦探社</div>

    <div class="tab-bar">
        <div class="tab-item active" data-tab="login">已有账号 · 登录</div>
        <div class="tab-item" data-tab="register">新用户 · 注册</div>
    </div>

    <div class="form-panel show" id="panel-login">
        <div class="input-item">
            <label>邮箱</label>
            <input type="email" id="login-email" placeholder="your@mail.com">
        </div>
        <div class="input-item">
            <label>密码</label>
            <input type="password" id="login-pwd" placeholder="输入密码">
        </div>
        <button class="submit-btn" id="btn-login">登录进入</button>
        <div class="msg-tip" id="login-msg"></div>
    </div>

    <div class="form-panel" id="panel-register">
        <div class="input-item">
            <label>邮箱</label>
            <input type="email" id="reg-email" placeholder="your@mail.com">
        </div>
        <div class="input-item">
            <label>设置密码</label>
            <input type="password" id="reg-pwd" placeholder="至少6位字符">
        </div>
        <div class="input-item">
            <label>确认密码</label>
            <input type="password" id="reg-pwd2" placeholder="再次输入密码">
        </div>
        <button class="submit-btn" id="btn-register">创建账号</button>
        <div class="msg-tip" id="reg-msg"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://beskfflajjthquaqbbbe.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJlc2tmZmxhamp0aHF1YXFiYmJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NjYyMTEsImV4cCI6MjEwMTM0MjIxMX0.ky0o3pHQZ2NSY9fh_R6HjaJk_UONUujjpleBiQRU4zM";
const { createClient } = window.supabase;
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Tab切换
const tabs = document.querySelectorAll('.tab-item');
tabs.forEach(t=>{
    t.addEventListener('click', ()=>{
        tabs.forEach(x=>x.classList.remove('active'));
        t.classList.add('active');
        const tabName = t.dataset.tab;
        document.getElementById('panel-login').classList.toggle('show', tabName==='login');
        document.getElementById('panel-register').classList.toggle('show', tabName==='register');
    })
})

// 登录按钮：校验账号密码，成功跳 dashboard.html
document.getElementById('btn-login').addEventListener('click', async ()=>{
    const email = document.getElementById('login-email').value.trim();
    const pwd = document.getElementById('login-pwd').value;
    const tip = document.getElementById('login-msg');
    tip.innerText = "";
    const {data,error} = await supabase.auth.signInWithPassword({email,password:pwd});
    if(error){
        tip.innerText = error.message;
        return;
    }
    location.replace("dashboard.html");
})

// 注册按钮
document.getElementById('btn-register').addEventListener('click', async ()=>{
    const email = document.getElementById('reg-email').value.trim();
    const pwd = document.getElementById('reg-pwd').value;
    const pwd2 = document.getElementById('reg-pwd2').value;
    const tip = document.getElementById('reg-msg');
    tip.innerText = "";
    if(pwd !== pwd2){
        tip.innerText = "两次密码不一致";
        return;
    }
    if(pwd.length<6){
        tip.innerText = "密码至少6位";
        return;
    }
    const {data,error} = await supabase.auth.signUp({email,password:pwd});
    if(error){
        tip.innerText = error.message;
        return;
    }
    tip.innerText = "注册成功，请前往邮箱确认邮件";
})

// 如果已经登录，直接跳dashboard
document.addEventListener("DOMContentLoaded",async ()=>{
    const {data:{user}} = await supabase.auth.getUser();
    if(user){
        location.replace("dashboard.html");
    }
})
</script>
</body>
</html>
