<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 | S侦探社</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        :root {
            --bg-primary: #0b0c10;
            --text-main: #f2f3f7;
            --text-sub: #989ca8;
            --accent: #7398ff;
            --accent-fade: rgba(115, 152, 255, 0.12);
            --border-fade: rgba(255, 255, 255, 0.08);
            --card-bg: rgba(255,255,255,0.03);
            --transition: all 0.28s ease;
        }
        html.light {
            --bg-primary: #f7f8fc;
            --text-main: #11141c;
            --text-sub: #595d6b;
            --accent: #507ee8;
            --accent-fade: rgba(80, 126, 232, 0.1);
            --border-fade: rgba(0, 0, 0, 0.1);
            --card-bg: #ffffff;
        }
        body {
            background: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1.6rem;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }
        .container {
            max-width: 1160px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem 2rem;
            margin-bottom: 4rem;
        }
        .logo {
            font-size: 1.45rem;
            font-weight: 500;
            letter-spacing: 1px;
        }
        .nav-wrapper {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 2rem;
        }
        .nav-wrapper a {
            color: var(--text-sub);
            text-decoration: none;
            font-size: 1rem;
            position: relative;
            transition: var(--transition);
        }
        .nav-wrapper a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -4px;
            width: 0;
            height: 1px;
            background: var(--accent);
            transition: var(--transition);
        }
        .nav-wrapper a:hover,
        .nav-wrapper a.active {
            color: var(--accent);
        }
        .nav-wrapper a:hover::after,
        .nav-wrapper a.active::after {
            width: 100%;
        }
        .search-input {
            padding: 0.5rem 1rem;
            background: transparent;
            border: 1px solid var(--border-fade);
            border-radius: 8px;
            color: var(--text-main);
        }
        #themeBtn {
            background: transparent;
            border: 1px solid var(--border-fade);
            color: var(--text-main);
            padding: 0.6rem 1.1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
        }
        #themeBtn:hover {
            border-color: var(--accent);
            background: var(--accent-fade);
        }

        /* 顶部轮播作品区 */
        .carousel-wrap {
            position: relative;
            border: 1px solid var(--border-fade);
            border-radius: 12px;
            padding: 4rem 2rem;
            text-align: center;
            margin-bottom: 3rem;
            background: var(--card-bg);
        }
        .carousel-wrap h2 {
            font-size: 2.2rem;
            font-weight: 400;
        }
        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border:1px solid var(--border-fade);
            background: transparent;
            color: var(--text-main);
            font-size: 1.4rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .arrow:hover{
            background: var(--accent-fade);
            border-color: var(--accent);
        }
        .arrow-left {left:16px;}
        .arrow-right {right:16px;}

        /* 作品列表卡片 */
        .work-list {
            display: grid;
            gap: 1.2rem;
        }
        .work-card {
            display: grid;
            grid-template-columns: 160px 1fr 120px;
            align-items: center;
            gap:1.5rem;
            background: var(--card-bg);
            border: 1px solid var(--border-fade);
            border-radius: 10px;
            padding:1.4rem;
            transition: var(--transition);
        }
        .work-card:hover{
            border-color: var(--accent);
            background: var(--accent-fade);
        }
        .work-title {
            font-size:1.2rem;
        }
        .work-desc {
            color: var(--text-sub);
        }
        .work-tag {
            text-align:center;
            padding:0.4rem;
            border:1px solid var(--border-fade);
            border-radius:6px;
            font-size:0.9rem;
            color:var(--text-sub);
        }

        footer {
            max-width: 1160px;
            margin: 6rem auto 0;
            padding-top: 2rem;
            border-top: 1px solid var(--border-fade);
            color: var(--text-sub);
            font-size: 0.9rem;
        }
        /* 移动端适配 */
        @media(max-width:720px){
            .work-card{
                grid-template-columns: 1fr;
                gap:0.6rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <nav>
        <div class="logo">S侦探社</div>
        <div class="nav-wrapper">
            <a href="#">个人中心</a>
            <a href="dashboard.html" class="active">首页</a>
            <a href="forum.html">论坛</a>
            <input class="search-input" placeholder="搜索作品/帖子">
            <button id="themeBtn">切换明暗</button>
        </div>
    </nav>

    <!-- 轮播展示栏 -->
    <div class="carousel-wrap">
        <button class="arrow arrow-left">&lt;</button>
        <h2>展示作品</h2>
        <button class="arrow arrow-right">&gt;</button>
    </div>

    <!-- 作品条目 -->
    <div class="work-list">
        <div class="work-card">
            <div class="work-title">密室诡计研究实录</div>
            <div class="work-desc">汇总数十种经典密室手法，附带案例拆解与创新思路探讨。</div>
            <div class="work-tag">图文</div>
        </div>
        <div class="work-card">
            <div class="work-title">雨夜访客｜短篇推理</div>
            <div class="work-desc">原创悬疑短篇，多重反转，适合文字解谜爱好者阅读。</div>
            <div class="work-tag">文字</div>
        </div>
        <div class="work-card">
            <div class="work-title">ARG预告短片</div>
            <div class="work-desc">全新线上解谜活动先导预告，线索暗藏画面之中。</div>
            <div class="work-tag">视频</div>
        </div>
    </div>
</div>

<footer>
    © 2026 S侦探社 | 推理创作社群
</footer>

<script>
(function(){
    const html = document.documentElement;
    const btn = document.getElementById('themeBtn');
    const savedTheme = localStorage.getItem('site-theme');
    if(savedTheme === 'light'){
        html.classList.add('light');
    }
    btn.onclick = function(){
        if(html.classList.contains('light')){
            html.classList.remove('light');
            localStorage.setItem('site-theme','dark');
        }else{
            html.classList.add('light');
            localStorage.setItem('site-theme','light');
        }
    }
})();
</script>
</body>
</html>
