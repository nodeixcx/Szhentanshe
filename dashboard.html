<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S侦探社｜内部主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* 清晰优化字体，消除文字发丑 */
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }
        :root {
            /* 主配色：秋波蓝、若竹，彻底移除紫/靛 */
            --wave-blue: #4A8BB8;
            --bamboo-green: #87B88F;
            --warm-tint: #D8A979;
            /* 渐变背景，禁止纯平单色 */
            --bg-dark-gradient: linear-gradient(145deg, #0c0e13 0%, #12161d 100%);
            --bg-light-gradient: linear-gradient(145deg, #f8f8f6 0%, #efefec 100%);
            /* 文字层级深浅分离，观感柔和 */
            --text-main-dark: #0f141b;
            --text-sub-dark: #424a57;
            --text-main-light: #f6f7fa;
            --text-sub-light: #b8c0cf;
            /* 辅助透明色 */
            --accent-fade: rgba(74, 139, 184, 0.14);
            --green-fade: rgba(135, 184, 0.12);
            --border-fade: rgba(255, 255, 255, 0.09);
            --border-light-fade: rgba(0, 0, 0, 0.11);
            /* 动画：全部禁用ease-in-out，自定义弹性贝塞尔 */
            --anim-fast: all 0.24s cubic-bezier(0.22, 1, 0.36, 1);
            --anim-page: all 0.65s cubic-bezier(0.16, 1, 0.3, 1);
            --anim-card-pop: all 0.5s cubic-bezier(0.18, 1, 0.28, 1);
            /* 圆角约束：禁止超大圆角，统一小幅弧度 */
            --radius-sm: 4px;
            --radius-md: 7px;
        }
        html.light {
            --bg-primary: var(--bg-light-gradient);
            --text-main: var(--text-main-dark);
            --text-sub: var(--text-sub-dark);
            --border-fade: var(--border-light-fade);
        }
        html:not(.light) {
            --bg-primary: var(--bg-dark-gradient);
            --text-main: var(--text-main-light);
            --text-sub: var(--text-sub-light);
        }
        /* 全局噪点纹理，杜绝纯色平板背景 */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: 0.04;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }
        body {
            background: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            /* 页面入场基础动画：从下方缓慢显现 */
            opacity: 0;
            transform: translateY(12px);
            transition: var(--anim-page);
            line-height: 1.6;
        }
        /* 页面加载完成显现 */
        body.page-ready {
            opacity: 1;
            transform: translateY(0);
        }
        /* 页面跳转离场动画 */
        body.page-leave {
            opacity: 0;
            transform: translateY(-12px) scale(0.98);
        }
        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            padding: 1.2rem 5%;
            border-bottom: 1px solid var(--border-fade);
        }
        .brand {
            font-size: 1.4rem;
            font-weight: 500;
        }
        .nav-spacer {
            flex: 1;
        }
        nav button, nav a {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-fade);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-md);
            text-decoration: none;
            cursor: pointer;
            transition: var(--anim-fast);
        }
        nav button:hover, nav a:hover {
            border-color: var(--wave-blue);
            background: var(--accent-fade);
        }
        /* 打破完美居中：右侧留白更大，不左右均等 */
        main {
            max-width: 1000px;
            margin: 3rem 3% 3rem auto;
            padding: 0 2%;
        }
        h2 {
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            font-weight: 450;
            color: var(--text-main);
        }
        .admin-entry {
            font-size: 0.9rem;
            padding: 0.35rem 0.8rem;
            background: var(--accent-fade);
            border: 1px solid var(--wave-blue);
            border-radius: var(--radius-sm);
            text-decoration: none;
            color: var(--wave-blue);
            transition: var(--anim-fast);
        }
        .admin-entry:hover {
            border-color: var(--bamboo-green);
            background: var(--green-fade);
            color: var(--bamboo-green);
        }
        .works-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
        }
        /* 作品卡片初始隐藏偏移，实现逐个弹出动画 */
        .work-card {
            background: transparent;
            border: 1px solid var(--border-fade);
            border-radius: var(--radius-md);
            padding: 1.2rem;
            opacity: 0;
            transform: translateY(20px);
            transition: var(--anim-card-pop);
        }
        /* 加载后激活显现类，缓慢上浮 */
        .work-card.show {
            opacity: 1;
            transform: translateY(0);
        }
        .work-card:hover {
            border-color: var(--wave-blue);
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.07);
        }
        .work-card h3 {
            margin-bottom: 0.6rem;
            font-weight: 500;
            color: var(--text-main);
        }
        .work-card p {
            color: var(--text-sub);
        }
        .work-card img {
            width: 100%;
            border-radius: var(--radius-sm);
            margin: 8px 0;
            object-fit: cover;
        }
        .empty-tip {
            opacity: 0.7;
            text-align: center;
            padding: 3rem 0;
            color: var(--text-sub);
        }
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--wave-blue);
            color: #fff;
            padding: 0.8rem 1.6rem;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.18);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: var(--anim-fast);
        }
        .toast.show {
            opacity: 1;
            pointer-events: auto;
        }
        .toast.error {
            background: #e06060;
        }
    </style>
</head>
<body>
    <nav>
        <div class="brand">S侦探社</div>
        <div class="nav-spacer"></div>
        <button id="themeToggle">切换明暗</button>
        <a href="personal.html">个人中心</a>
        <a href="forum.html">论坛</a>
        <button id="logoutBtn">退出登录</button>
    </nav>
    <main>
        <h2>官方发布作品 <a id="adminLink" class="admin-entry" style="display:none" href="admin.html">管理员基地</a></h2>
        <div id="worksWrap" class="works-container">
            <div class="empty-tip">加载中……</div>
        </div>
    </main>
    <div id="toast" class="toast"></div>
    <script>
        // 全局页面入场&跨页面切换动画（和index/login互通）
        document.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('page-ready');
            // 拦截a标签跳转，触发离场动画
            document.querySelectorAll('a[href]').forEach(link => {
                link.addEventListener('click', function(e) {
                    const target = this.getAttribute('href');
                    if(target && !target.startsWith('#')) {
                        e.preventDefault();
                        document.body.classList.add('page-leave');
                        setTimeout(() => location.href = target, 360);
                    }
                })
            })
            // 重写location跳转方法，按钮跳转带动画
            const originReplace = location.replace;
            const originAssign = location.assign;
            location.replace = function(href) {
                document.body.classList.add('page-leave');
                setTimeout(() => originReplace.call(location, href), 360);
            }
            location.assign = function(href) {
                document.body.classList.add('page-leave');
                setTimeout(() => originAssign.call(location, href), 360);
            }
        })

        // ========== 1. 明暗主题切换（原版逻辑完整保留） ==========
        (function initTheme() {
            const htmlRoot = document.documentElement;
            const themeBtn = document.getElementById('themeToggle');
            const saved = localStorage.getItem('site-theme');
            if (saved === 'light') htmlRoot.classList.add('light');
            themeBtn.addEventListener('click', function() {
                htmlRoot.classList.toggle('light');
                localStorage.setItem('site-theme', htmlRoot.classList.contains('light') ? 'light' : 'dark');
            });
        })();
        // ========== 2. Toast 提示（原版无修改） ==========
        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast' + (isError ? ' error' : '');
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 3500);
        }
        // ========== 3. Supabase 全局配置 完全沿用原版代码 ==========
        const SUPABASE_URL = "https://beskfflajjthquaqbbbe.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJlc2tmZmxhamp0aHF1YXFiYmJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NjYyMTEsImV4cCI6MjEwMTM0MjIxMX0.ky0o3pHQZ2NSY9fh_R6HjaJk_UONUujjpleBiQRU4zM";
        const STORAGE_KEY = 'sb-auth-token-sdetective';
        let supabase = null;
        const worksWrap = document.getElementById('worksWrap');
        const adminLink = document.getElementById('adminLink');
        // ========== 4. 加载SDK并强制持久会话（原版不变） ==========
        function loadSupabase() {
            return new Promise((resolve) => {
                const script = document.createElement('script');
                script.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1/dist/umd/supabase.js";
                script.onload = function() {
                    try {
                        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                            auth: {
                                persistSession: true,
                                autoRefreshToken: true,
                                storageKey: STORAGE_KEY
                            }
                        });
                        worksWrap.innerHTML = `<div class="empty-tip">✅ 连接成功，加载作品中...</div>`;
                        resolve(true);
                    } catch (err) {
                        worksWrap.innerHTML = `<div class="empty-tip">❌ 配置错误：${err.message}</div>`;
                        showToast('Supabase 初始化失败，请检查 URL/密钥', true);
                        resolve(false);
                    }
                };
                script.onerror = function() {
                    showToast('主 CDN 加载失败，尝试备用源...', true);
                    const fallback = document.createElement('script');
                    fallback.src = "https://unpkg.com/@supabase/supabase-js@2.45.1/dist/umd/supabase.js";
                    fallback.onload = function() {
                        try {
                            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                                auth: { persistSession: true, autoRefreshToken: true, storageKey: STORAGE_KEY }
                            });
                            worksWrap.innerHTML = `<div class="empty-tip">✅ 备用源连接成功，加载作品中...</div>`;
                            resolve(true);
                        } catch (err) {
                            worksWrap.innerHTML = `<div class="empty-tip">❌ 备用源配置错误：${err.message}</div>`;
                            showToast('Supabase 初始化失败', true);
                            resolve(false);
                        }
                    };
                    fallback.onerror = function() {
                        worksWrap.innerHTML = `<div class="empty-tip">❌ 所有 CDN 均加载失败，请检查网络</div>`;
                        showToast('网络异常，无法加载 SDK', true);
                        resolve(false);
                    };
                    document.head.appendChild(fallback);
                };
                document.head.appendChild(script);
            });
        }
        // ========== 5. 校验管理员身份（原版不变） ==========
        async function checkAdmin(uid) {
            try {
                const {data:profile} = await supabase.from('profiles').select('is_admin').eq('id',uid).single();
                if(profile?.is_admin === true){
                    adminLink.style.display = "inline-block";
                }
            } catch (err) {}
        }
        // ========== 6. HTML转义防XSS（原版不变） ==========
        function escapeHtml(s) {
            if (!s) return '';
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        // ========== 7. 加载作品 + 新增卡片逐个缓慢弹出动画 ==========
        async function loadWorks() {
            if (!supabase) return;
            try {
                const { data, error } = await supabase
                    .from('works')
                    .select('*')
                    .order('created_at', { ascending: false });
                if (error) {
                    worksWrap.innerHTML = `<div class="empty-tip">读取失败：${error.message}</div>`;
                    return;
                }
                if (!data || data.length === 0) {
                    worksWrap.innerHTML = `<div class="暂无官方发布作品</div>`;
                    return;
                }
                let tpl = '';
                data.forEach(item => {
                    const title = escapeHtml(item.title || '无标题');
                    const content = escapeHtml(item.content || '');
                    let imageHtml = '';
                    if(item.image_url){
                        const safeImgUrl = escapeHtml(item.image_url);
                        imageHtml = `<img src="${safeImgUrl}" alt="作品配图">`;
                    }
                    tpl += `
                        <div class="work-card">
                            <h3>${title}</h3>
                            <p>${content}</p>
                            ${imageHtml}
                        </div>
                    `;
                });
                worksWrap.innerHTML = tpl;
                // 每张卡片间隔120ms依次上浮显现，实现慢慢弹出来效果
                const cards = document.querySelectorAll('.work-card');
                cards.forEach((card, index) => {
                    setTimeout(() => {
                        card.classList.add('show');
                    }, index * 120);
                })
            } catch (err) {
                worksWrap.innerHTML = `<div class="empty-tip">请求异常：${err.message}</div>`;
                showToast('加载作品失败', true);
            }
        }
        // ========== 8. 退出登录（原版完整逻辑） ==========
        document.getElementById('logoutBtn').addEventListener('click', async function() {
            if (!supabase) {
                location.href = "login.html";
                return;
            }
            if (confirm('确定要退出登录吗？')) {
                await supabase.auth.signOut();
                showToast('已退出，登录记录清除');
                setTimeout(() => location.href = "login.html", 500);
            }
        });
        // ========== 9. 页面入口（原版不变） ==========
        async function init() {
            const sdkReady = await loadSupabase();
            if (!sdkReady) return;
            let waitCount = 0;
            let session = null;
            while(waitCount < 12){
                const res = await supabase.auth.getSession();
                session = res.data.session;
                if(session) break;
                waitCount++;
                await new Promise(r=>setTimeout(r,100));
            }
            if(!session){
                showToast('未登录，请前往登录页', true);
                setTimeout(() => location.replace("login.html"), 600);
                return;
            }
            await checkAdmin(session.user.id);
            await loadWorks();
        }
        init();
        supabase.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_OUT' || (event === 'TOKEN_REFRESHED' && !session)) {
                showToast('登录会话已过期，请重新登录', true);
                setTimeout(()=>location.replace('login.html'),800);
            }
        });
    </script>
</body>
</html>
