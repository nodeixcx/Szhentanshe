<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S侦探社｜首页</title>
    <style>
        :root {
            --bg:#0f1118;
            --card:#1a1d28;
            --text:#e6e8f0;
            --text‑sec:#a0a6b8;
            --accent:#6379f4;
            --border:#2c3040;
        }
        [data‑theme="light"]{
            --bg:#f7f8fa;
            --card:#ffffff;
            --text:#1c202c;
            --text‑sec:#585e70;
            --accent:#4058e8;
            --border:#dde1ec;
        }
        *{margin:0;padding:0;box‑sizing:border‑box;font‑family:system‑ui,‑apple‑system,BlinkMacSystemFont,"Segoe UI",Roboto,sans‑serif;}
        body{background:var(--bg);color:var(--text);min‑height:100vh;transition:background 0.3s,color 0.3s;}
        header{display:flex;align‑items:center;justify‑content:space‑between;padding:1rem 1.5rem;border‑bottom:1px solid var(--border);flex‑wrap:wrap;gap:1rem;}
        .logo{font‑size:1.35rem;font‑weight:600;}
        .nav‑bar{display:flex;gap:1.25rem;align‑items:center;flex‑wrap:wrap;}
        .nav‑bar a{color:var(--text‑sec);text‑decoration:none;transition:color 0.2s;}
        .nav‑bar a:hover{color:var(--accent);}
        .theme‑btn{background:transparent;border:1px solid var(--border);color:var(--text);padding:0.4rem 0.8rem;border‑radius:8px;cursor:pointer;}
        .container{max‑width:1200px;margin:0 auto;padding:2rem 1.25rem;}
        .page‑title{font‑size:1.8rem;margin‑bottom:2rem;font‑weight:600;}
        .works‑grid{display:grid;grid‑template‑columns:repeat(auto‑fill,minmax(280px,1fr));gap:1.5rem;}
        .work‑card{background:var(--card);border:1px solid var(--border);border‑radius:14px;overflow:hidden;transition:transform 0.25s;}
        .work‑card:hover{transform:translateY(-4px);}
        .card‑inner{padding:1.25rem;}
        .work‑title{font‑size:1.1rem;font‑weight:600;margin‑bottom:0.6rem;}
        .work‑desc{color:var(--text‑sec);font‑size:0.925rem;line‑height:1.6;}
        .logout‑btn{background:var(--accent);color:#fff;border:none;padding:0.45rem 0.9rem;border‑radius:8px;cursor:pointer;}
        .tip‑box{text‑align:center;margin‑top:4rem;color:var(--text‑sec);}
    </style>
</head>
<body>
<header>
    <div class="logo">S侦探社</div>
    <div class="nav‑bar">
        <a href="dashboard.html">作品首页</a>
        <a href="forum.html">论坛</a>
        <a href="#">个人中心</a>
        <button class="theme‑btn" id="toggleTheme">切换主题</button>
        <button class="logout‑btn" id="logoutBtn">退出登录</button>
    </div>
</header>
<div class="container">
    <h1 class="page‑title">官方发布作品</h1>
    <div class="works‑grid" id="worksContainer">
        <!-- 作品由Supabase动态渲染 -->
    </div>
    <div class="tip‑box" id="emptyTip">加载中…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ========== 你的项目配置 ==========
const SUPABASE_URL = "https://beskfflajjthquaqbbbe.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJlc2tmZmxhamp0aHF1YXFiYmJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NjYyMTEsImV4cCI6MjEwMTM0MjIxMX0.ky0o3pHQZ2NSY9fh_R6HjaJk_UONUujjpleBiQRU4zM";
const { createClient } = window.supabase;
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// 主题
const toggleBtn = document.getElementById('toggleTheme');
function applyTheme(){
    const saved = localStorage.getItem("theme");
    if(saved) document.documentElement.setAttribute('data‑theme',saved);
}
toggleBtn.onclick=()=>{
    const curr = document.documentElement.getAttribute('data‑theme');
    const next = curr==="light"?"dark":"light";
    document.documentElement.setAttribute('data‑theme',next);
    localStorage.setItem("theme",next);
};
applyTheme();

// 登录校验：未登录跳转到登录页
async function checkAuth(){
    const {data:{user}} = await supabase.auth.getUser();
    if(!user){
        location.href="login.html";
    }
}

// 退出登录
document.getElementById('logoutBtn').onclick=async ()=>{
    await supabase.auth.signOut();
    location.href="login.html";
};

// 读取作品列表
async function loadWorks(){
    const container = document.getElementById("worksContainer");
    const tip = document.getElementById("emptyTip");
    const {data,error} = await supabase.from("works").select("*").order("created_at",{ascending:false});
    if(error){
        tip.textContent="读取作品失败："+error.message;
        return;
    }
    if(!data||data.length===0){
        tip.textContent="暂时还没有发布作品";
        return;
    }
    tip.style.display="none";
    data.forEach(item=>{
        const div=document.createElement("div");
        div.className="work‑card";
        div.innerHTML=`
        <div class="card‑inner">
            <div class="work‑title">${escapeHtml(item.title)}</div>
            <div class="work‑desc">${escapeHtml(item.content||"暂无简介")}</div>
        </div>`;
        container.appendChild(div);
    })
}
function escapeHtml(s){
    if(!s)return "";
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

(async ()=>{
    await checkAuth();
    await loadWorks();
})();
</script>
</body>
</html>
