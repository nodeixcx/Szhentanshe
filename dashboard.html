<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S侦探社｜内部主页</title>
    <style>
        /* 噪点背景SVG */
        :root {
            --primary: #4A8BB8;
            --secondary: #87B88F;
            --text-main: #f2f3f7;
            --text-sub: #989ca8;
            --accent-fade: rgba(74, 139, 184, 0.12);
            --border-fade: rgba(255, 255, 255, 0.08);
            --bezier: cubic‑bezier(0.22, 0.01, 0.28, 1);
            --noise: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            --bg-gradient: linear-gradient(142deg,#0b0e12,#14181e);
        }
        html.light {
            --primary: #4A8BB8;
            --secondary: #87B88F;
            --text-main: #11141c;
            --text-sub: #595d6b;
            --accent-fade: rgba(74, 139, 184, 0.10);
            --border-fade: rgba(0, 0, 0, 0.10);
            --bg-gradient: linear-gradient(142deg,#f3f5f8,#e9ecec);
        }
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, -apple-system, sans-serif}

        body {
            background: var(--bg-gradient);
            background-image: var(--bg-gradient), var(--noise);
            color:var(--text-main);
            min-height:100vh;
            transition: background 0.34s var(--bezier), color 0.34s var(--bezier);
            /* 入场动画 */
            animation: pageIn 0.64s var(--bezier) forwards;
        }
        @keyframes pageIn {
            from { opacity:0; transform: translateY(24px); }
            to { opacity:1; transform: translateY(0); }
        }
        .page‑exit {
            animation: pageOut 0.48s var(--bezier) forwards;
        }
        @keyframes pageOut {
            to { opacity:0; transform: translateY(-18px) scale(0.97); }
        }

        nav{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;padding:1.2rem 3%;border-bottom:1px solid var(--border-fade)}
        .brand{font-size:1.4rem;font-weight:bold}
        .nav-spacer{flex:1}
        nav button, nav a{
            background:transparent;
            color:var(--text-main);
            border:1px solid var(--border-fade);
            padding:0.5rem 1rem;
            border-radius:4px;
            text-decoration:none;
            cursor:pointer;
            transition: border‑color 0.26s var(--bezier), background 0.26s var(--bezier);
        }
        nav button:hover, nav a:hover{
            border-color:var(--primary);
            background:var(--accent-fade);
        }
        main{max-width:1000px;margin:3rem 3% 3rem auto;padding:0}
        h2{margin-bottom:1.2rem;display:flex;align-items:center;gap:1rem}
        .admin-entry{
            font-size:0.9rem;
            padding:0.35rem 0.8rem;
            background:var(--accent-fade);
            border:1px solid var(--primary);
            border-radius:4px;
            text-decoration:none;
            color:var(--primary);
            transition: border‑color 0.26s var(--bezier), background 0.26s var(--bezier);
        }
        .admin-entry:hover {
            border-color:var(--secondary);
        }
        .works-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.2rem}
        .work-card{
            background:transparent;
            border:1px solid var(--border-fade);
            border-radius:7px;
            padding:1.2rem;
            transition: border‑color 0.26s var(--bezier);
        }
        .work-card:hover{border-color:var(--primary)}
        .work-card h3{margin-bottom:0.6rem}
        .work-card img{
            width:100%;
            border-radius:4px;
            margin:8px 0;
            object-fit:cover;
        }
        .empty-tip{opacity:0.6;text-align:center;padding:3rem 0}
        .toast{
            position:fixed;
            bottom:2rem;
            left:50%;
            transform:translateX(-50%);
            background:var(--primary);
            color:#fff;
            padding:0.8rem 1.6rem;
            border-radius:4px;
            font-size:0.95rem;
            box-shadow:0 8px 24px rgba(0,0,0,0.3);
            z-index:999;
            opacity:0;
            transition:opacity 0.3s var(--bezier);
            pointer-events:none;
        }
        .toast.show{opacity:1;pointer-events:auto}
        .toast.error{background:#f87171}
    </style>
</head>
<body>
    <nav>
        <div class="brand">S侦探社</div>
        <div class="nav-spacer"></div>
        <button id="themeToggle">切换明暗</button>
        <a href="personal.html">个人中心</a>
        <a href="forum.html">论坛</a>
        <button id="logoutBtn">退出登录</button>
    </nav>

    <main>
        <h2>官方发布作品 <a id="adminLink" class="admin-entry" style="display:none" href="admin.html">管理员基地</a></h2>
        <div id="worksWrap" class="works-container">
            <div class="empty-tip">加载中……</div>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script>
        // 页面离开触发滑出动画
        document.querySelectorAll('a, #logoutBtn').forEach(el=>{
            el.addEventListener('click',e=>{
                const target = el.tagName==='A' ? el.href : null;
                if(!target && el.id!=='logoutBtn') return;
                e.preventDefault();
                document.body.classList.add('page‑exit');
                setTimeout(()=>{
                    if(target) location.href = target;
                    else el.click();
                },440);
            })
        })

        // ========== 1. 明暗主题切换 ==========
        (function initTheme() {
            const htmlRoot = document.documentElement;
            const themeBtn = document.getElementById('themeToggle');
            const saved = localStorage.getItem('site-theme');
            if (saved === 'light') htmlRoot.classList.add('light');
            themeBtn.addEventListener('click', function() {
                htmlRoot.classList.toggle('light');
                localStorage.setItem('site-theme', htmlRoot.classList.contains('light') ? 'light' : 'dark');
            });
        })();

        // ========== 2. Toast 提示 ==========
        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast' + (isError ? ' error' : '');
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 3500);
        }

        // ========== 3. Supabase 全局配置 ==========
        const SUPABASE_URL = "https://beskfflajjthquaqbbbe.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJlc2tmZmxhamp0aHF1YXFiYmJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NjYyMTEsImV4cCI6MjEwMTM0MjIxMX0.ky0o3pHQZ2NSY9fh_R6HjaJk_UONUujjpleBiQRU4zM";
        const STORAGE_KEY = 'sb-auth-token-sdetective';
        let supabase = null;
        const worksWrap = document.getElementById('worksWrap');
        const adminLink = document.getElementById('adminLink');

        // ========== 4. 加载SDK并强制持久会话 ==========
        function loadSupabase() {
            return new Promise((resolve) => {
                const script = document.createElement('script');
                script.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1/dist/umd/supabase.js";
                script.onload = function() {
                    try {
                        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                            auth: {
                                persistSession: true,
                                autoRefreshToken: true,
                                storageKey: STORAGE_KEY
                            }
                        });
                        worksWrap.innerHTML = `<div class="empty-tip">✅ 连接成功，加载作品中...</div>`;
                        resolve(true);
                    } catch (err) {
                        worksWrap.innerHTML = `<div class="empty-tip">❌ 配置错误：${err.message}</div>`;
                        showToast('Supabase 初始化失败，请检查 URL/密钥', true);
                        resolve(false);
                    }
                };
                script.onerror = function() {
                    showToast('主 CDN 加载失败，尝试备用源...', true);
                    const fallback = document.createElement('script');
                    fallback.src = "https://unpkg.com/@supabase/supabase-js@2.45.1/dist/umd/supabase.js";
                    fallback.onload = function() {
                        try {
                            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                                auth: { persistSession: true, autoRefreshToken: true, storageKey: STORAGE_KEY }
                            });
                            worksWrap.innerHTML = `<div class="empty-tip">✅ 备用源连接成功，加载作品中...</div>`;
                            resolve(true);
                        } catch (err) {
                            worksWrap.innerHTML = `<div class="empty-tip">❌ 备用源配置错误：${err.message}</div>`;
                            showToast('Supabase 初始化失败', true);
                            resolve(false);
                        }
                    };
                    fallback.onerror = function() {
                        worksWrap.innerHTML = `<div class="empty-tip">❌ 所有 CDN 均加载失败，请检查网络</div>`;
                        showToast('网络异常，无法加载 SDK', true);
                        resolve(false);
                    };
                    document.head.appendChild(fallback);
                };
                document.head.appendChild(script);
            });
        }

        // ========== 5. 校验管理员身份 ==========
        async function checkAdmin(uid) {
            try {
                const {data:profile} = await supabase.from('profiles').select('is_admin').eq('id',uid).single();
                if(profile?.is_admin === true){
                    adminLink.style.display = "inline-block";
                }
            } catch (err) {}
        }

        // ========== 6. 加载作品（带图片渲染） ==========
        async function loadWorks() {
            if (!supabase) return;
            try {
                const { data, error } = await supabase
                    .from('works')
                    .select('*')
                    .order('created_at', { ascending: false });
                if (error) {
                    worksWrap.innerHTML = `<div class="empty-tip">读取失败：${error.message}</div>`;
                    return;
                }
                if (!data || data.length === 0) {
                    worksWrap.innerHTML = `<div class="empty-tip">暂无官方发布作品</div>`;
                    return;
                }
                let tpl = '';
                data.forEach(item => {
                    const title = escapeHtml(item.title || '无标题');
                    const content = escapeHtml(item.content || '');
                    let imageHtml = '';
                    if(item.image_url){
                        const safeImgUrl = escapeHtml(item.image_url);
                        imageHtml = `<img src="${safeImgUrl}" alt="作品配图">`;
                    }
                    tpl += `
                        <div class="work-card">
                            <h3>${title}</h3>
                            <p>${content}</p>
                            ${imageHtml}
                        </div>
                    `;
                });
                worksWrap.innerHTML = tpl;
            } catch (err) {
                worksWrap.innerHTML = `<div class="empty-tip">请求异常：${err.message}</div>`;
                showToast('加载作品失败', true);
            }
        }

        // ========== 7. HTML转义防XSS ==========
        function escapeHtml(s) {
            if (!s) return '';
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // ========== 8. 退出登录 ==========
        document.getElementById('logoutBtn').addEventListener('click', async function() {
            if (!supabase) {
                location.href = "login.html";
                return;
            }
            if (confirm('确定要退出登录吗？')) {
                await supabase.auth.signOut();
                showToast('已退出，登录记录清除');
                setTimeout(() => location.href = "login.html", 500);
            }
        });

        // ========== 9. 页面入口 ==========
        async function init() {
            const sdkReady = await loadSupabase();
            if (!sdkReady) return;

            let waitCount = 0;
            let session = null;
            while(waitCount < 12){
                const res = await supabase.auth.getSession();
                session = res.data.session;
                if(session) break;
                waitCount++;
                await new Promise(r=>setTimeout(r,100));
            }

            if(!session){
                showToast('未登录，请前往登录页', true);
                setTimeout(() => location.replace("login.html"), 600);
                return;
            }

            await checkAdmin(session.user.id);
            await loadWorks();
        }
        init();

        supabase.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_OUT' || (event === 'TOKEN_REFRESHED' && !session)) {
                showToast('登录会话已过期，请重新登录', true);
                setTimeout(()=>location.replace('login.html'),800);
            }
        });
    </script>
</body>
</html>
