<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S侦探社 | 欢迎</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* 全平台清晰中文字体栈 + 抗锯齿消除文字发糊 */
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }
        :root {
            /* 主配色：秋波蓝、若竹 */
            --wave-blue: #4A8BB8;
            --bamboo-green: #87B88F;
            --warm-tint: #D8A979;
            /* 深色渐变 */
            --bg-dark-gradient: linear-gradient(145deg, #0c0e13 0%, #12161d 100%);
            /* 修改浅色：乳白色底色 */
            --bg-light-gradient: linear-gradient(145deg, #f8f8f6 0%, #efefec 100%);
            /* 文字层级 */
            --text-main: #f2f3f7;
            --text-sub: #a1a5b3;
            --text-dark-main: #1a1f29;
            --text-dark-sub: #565b68;
            /* 透明辅助色 */
            --accent-fade: rgba(74, 139, 184, 0.14);
            --green-fade: rgba(135, 184, 143, 0.12);
            --border-fade: rgba(255, 255, 255, 0.09);
            --border-light-fade: rgba(0, 0, 0, 0.11);
            /* 动画：拉长页面弹出时长，禁用ease‑in‑out */
            --anim-fast: all 0.24s cubic-bezier(0.22, 1, 0.36, 1);
            --anim-page-switch: all 0.65s cubic-bezier(0.16, 1, 0.3, 1);
            /* 圆角限制 */
            --radius-sm: 4px;
            --radius-md: 7px;
        }
        html.light {
            --bg-primary: var(--bg-light-gradient);
            --text-main: var(--text-dark-main);
            --text-sub: var(--text-dark-sub);
            --border-fade: var(--border-light-fade);
        }
        html:not(.light) {
            --bg-primary: var(--bg-dark-gradient);
        }
        /* 全局噪点纹理 */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: 0.04;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }
        body {
            background: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1.6rem;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateY(12px);
            transition: var(--anim-page-switch);
            line-height: 1.65;
            letter-spacing: 0.2px;
        }
        body.page-ready {
            opacity: 1;
            transform: translateY(0);
        }
        body.page-leave {
            opacity: 0;
            transform: translateY(-12px) scale(0.98);
        }
        .container {
            max-width: 1160px;
            margin: 0 2% 0 auto;
            width: 100%;
            flex: 1;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem 2rem;
            margin-bottom: 8rem;
        }
        .logo {
            font-size: 1.45rem;
            font-weight: 500;
            letter-spacing: 1px;
        }
        .nav-wrapper {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 2rem;
        }
        #themeBtn {
            background: transparent;
            border: 1px solid var(--border-fade);
            color: var(--text-main);
            padding: 0.6rem 1.1rem;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            font-weight: 400;
            cursor: pointer;
            transition: var(--anim-fast);
        }
        #themeBtn:hover {
            border-color: var(--wave-blue);
            background: var(--accent-fade);
        }
        .hero {
            max-width: 680px;
            margin-left: 1%;
        }
        .hero h1 {
            font-size: clamp(2.6rem, 9vw, 3.6rem);
            font-weight: 450;
            line-height: 1.2;
            margin-bottom: 1.6rem;
            letter-spacing: 2px;
            opacity: 0.94;
        }
        .hero p {
            color: var(--text-sub);
            font-size: 1.12rem;
            line-height: 1.8;
            margin-bottom: 2.8rem;
            font-weight: 400;
        }
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1.3rem;
        }
        .btn-solid {
            padding: 1rem 2.2rem;
            background: var(--wave-blue);
            color: #fff;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: var(--anim-fast);
        }
        .btn-solid:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
            background: linear-gradient(90deg, var(--wave-blue), #5a99c7);
        }
        footer {
            max-width: 1160px;
            margin: 8rem 2% 0 auto;
            padding-top: 2rem;
            border-top: 1px solid var(--border-fade);
            color: var(--text-sub);
            font-size: 0.9rem;
            font-weight: 400;
        }
    </style>
</head>
<body>
<div class="container">
    <nav>
        <div class="logo">S侦探社</div>
        <div class="nav-wrapper">
            <button class="btn-solid" onclick="location.replace('login.html')">前往登录</button>
            <button id="themeBtn">切换明暗</button>
        </div>
    </nav>
    <section class="hero">
        <h1>S侦探社官方站点</h1>
        <p>交流、探讨、分享，在这里开启推理与创作。
        <br>登录后查看社团原创作品、进入推理论坛。</p>
        <div class="button-group">
            <button class="btn-solid" onclick="location.replace('login.html')">前往登录</button>
        </div>
    </section>
</div>
<footer>
    © 2026 S侦探社 | 推理创作社群
</footer>
<script>
// 主题优先初始化（修复按钮失效）
const html = document.documentElement;
const btn = document.getElementById('themeBtn');
const savedTheme = localStorage.getItem('site-theme');
if(savedTheme === 'light'){
    html.classList.add('light');
}
btn.onclick = function(){
    if(html.classList.contains('light')){
        html.classList.remove('light');
        localStorage.setItem('site-theme','dark');
    }else{
        html.classList.add('light');
        localStorage.setItem('site-theme','light');
    }
}
// 页面转场动画逻辑
document.addEventListener('DOMContentLoaded', () => {
    document.body.classList.add('page-ready');
    document.querySelectorAll('a[href]').forEach(link => {
        link.addEventListener('click', function(e) {
            const target = this.getAttribute('href');
            if(target && !target.startsWith('#')) {
                e.preventDefault();
                document.body.classList.add('page-leave');
                setTimeout(() => location.href = target, 360);
            }
        })
    })
    const originReplace = location.replace;
    const originAssign = location.assign;
    location.replace = function(href) {
        document.body.classList.add('page-leave');
        setTimeout(() => originReplace.call(location, href), 360);
    }
    location.assign = function(href) {
        document.body.classList.add('page-leave');
        setTimeout(() => originAssign.call(location, href), 360);
    }
})
</script>
</body>
</html>
