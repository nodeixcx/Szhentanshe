<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>侦探社 | 官网</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Inter, system-ui, sans-serif;
        }
        :root {
            --bg: #0f1014;
            --card: rgba(255,255,255,0.06);
            --text: #f0f0f0;
            --muted: #a0a0a8;
            --accent: #6388ff;
        }
        [data-theme="light"] {
            --bg: #f7f8fa;
            --card: rgba(255,255,255,0.7);
            --text: #181820;
            --muted: #555560;
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
            transition: 0.3s background;
        }
        nav {
            display:
            flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto 4rem;
        }
        .logo {
            font-size: 1.4rem;
            font-weight: 600;
        }
        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            margin-left: 2rem;
            transition: 0.2s;
        }
        .nav-links a:hover {
            color: var(--accent);
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .hero {
            margin-top: 6rem;
        }
        h1 {
            font-size: 2.8rem;
            margin-bottom: 1rem;
        }
        p {
            color: var(--muted);
            max-width: 600px;
            line-height: 1.7;
        }
        .btn-group {
            margin-top: 2rem;
        }
        button {
            padding: 0.8rem 1.6rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: .2s;
        }
        .btn-primary {
            background: var(--accent);
            color: white;
            margin-right: 1rem;
        }
        .btn-ghost {
            background: var(--card);
            color: var(--text);
        }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <div class="logo">侦探社</div>
            <div class="nav-links">
                <a href="#">首页</a>
                <a href="forum.html">论坛</a>
                <a href="login.html">登录</a>
                <button id="themeBtn">切换明暗</button>
            </div>
        </nav>

        <section class="hero">
            <h1>侦探社官方站点</h1>
            <p>交流、探讨、分享，在这里开启推理与创作。论坛系统持续开发中，欢迎加入。</p>
            <div class="btn-group">
                <button class="btn-primary" onclick="location.href='login.html'">前往登录</button>
                <button class="btn-ghost" onclick="location.href='forum.html'">浏览论坛</button>
            </div>
        </section>
    </div>

    <script>
        const btn = document.getElementById('themeBtn');
        btn.onclick = () => {
            document.documentElement.toggleAttribute('data-theme');
        }
    </script>
</body>
</html>
